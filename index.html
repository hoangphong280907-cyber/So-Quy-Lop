function openInboxSheet() { renderInboxSheet(); showSheet(); }

function renderInboxSheet() {
  const drafts = getDrafts();
  const el = $('#sheetContent');
  el.innerHTML = `
    <div class="flex justify-center pt-2.5 md:hidden"><span class="h-1.5 w-10 rounded-full bg-[var(--border)]"></span></div>
    <header class="flex items-center justify-between px-5 pb-2 pt-3">
      <div>
        <h1 class="text-[18px] font-semibold">Hộp thư nháp</h1>
        <p class="text-[12px] text-[var(--text-3)]">${drafts.length} khoản chờ phân loại</p>
      </div>
      <button data-sheet-close class="flex h-11 w-11 items-center justify-center rounded-xl text-[var(--text-2)] hover:bg-[var(--surface-2)]">✕</button>
    </header>
    <div class="scroll-y flex-1 overflow-y-auto px-5 pb-3 pt-2">
      ${drafts.length === 0
        ? `<div class="py-12 text-center">
            <p class="text-[14px] text-[var(--text-3)]">Không còn khoản nháp nào 🎉</p>
            <p class="mt-1 text-[12px] text-[var(--text-3)]">Sạch sẽ gọn gàng!</p>
          </div>`
        : drafts.map(t => {
          const w = t.wallet || t.account || 'cash';
          return `
          <div class="mb-3 rounded-xl border border-[var(--border)] p-3">
            <div class="flex items-center gap-2">
              <span class="text-[16px]">${catIcon(t.category)}</span>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[14px] font-medium">${escapeHtml(t.note || 'Chưa có ghi chú')}</p>
                <p class="text-[12px] text-[var(--text-3)]">${formatDateVN(t.date)} · ${w === 'cash' ? '💵 Tiền mặt' : '🏦 Chuyển khoản'}${t.member ? ` · 👤 ${escapeHtml(t.member)}` : ''}</p>
              </div>
              <span class="shrink-0 text-[15px] font-semibold tabular-nums ${t.type === 'in' ? 'text-[var(--income)]' : 'text-[var(--expense)]'}">
                ${t.type === 'in' ? '+' : '−'}${fmt(t.amount)}
              </span>
            </div>
            <p class="mt-2 text-[11px] text-[var(--text-3)]">Chọn danh mục:</p>
            <div class="mt-1 flex flex-wrap gap-1">
              ${(CATEGORIES[t.type] || []).map(c =>
                `<button data-classify="${t.id}:${c.id}" class="press rounded-md bg-[var(--surface-2)] px-2 py-1 text-[11px] font-medium">${c.icon} ${c.name}</button>`
              ).join('')}
            </div>
            <button data-edit-draft="${t.id}" class="mt-2 text-[11px] font-medium text-[var(--accent)]">Sửa chi tiết →</button>
          </div>`;
        }).join('')}
    </div>`;

  $$('[data-classify]', el).forEach(btn => {
    btn.onclick = () => {
      const [txId, catId] = btn.dataset.classify.split(':');
      const t = DB.transactions.find(x => x.id === txId); if (!t) return;
      const cat = getCategory(t.type, catId);
      t.category = catId; t.categoryName = cat.name; t.status = 'done';
      saveDB();
      toast(`Đã phân loại · ${cat.name}`, 'var(--income)');
      renderInboxSheet();
      if (currentView === 'home') render();
    };
  });

  $$('[data-edit-draft]', el).forEach(btn => {
    btn.onclick = () => {
      closeSheet();
      setTimeout(() => openCaptureSheet(btn.dataset.editDraft), 320);
    };
  });
}

/* ============================================================
   20. SHEET: SHOW/CLOSE
============================================================ */
function showSheet() {
  const ov = $('#sheetOverlay');
  const locked = isGuestLocked();
  ov.classList.toggle('guest-locked', locked);
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (fabEl) fabEl.classList.toggle('hidden', locked);
}
function closeSheet() {
  if (isGuestLocked()) return;
  const ov = $('#sheetOverlay');
  ov.classList.remove('open', 'guest-locked');
  document.body.style.overflow = '';
}
$('#sheetBackdrop').onclick = () => { if (!isGuestLocked()) closeSheet(); };
document.addEventListener('click', (e) => { if (e.target.closest('[data-sheet-close]') && !isGuestLocked()) closeSheet(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!$('#receiptModal').hidden) { $('#receiptModal').hidden = true; return; }
    if (!$('#qrModal').hidden) { $('#qrModal').hidden = true; activeQrContext = null; return; }
    if ($('#sheetOverlay').classList.contains('open') && !isGuestLocked()) closeSheet();
  }
});

/* ============================================================
   21. EXPORT EXCEL (.XLSX OFFLINE VIA SHEETJS) & CSV
============================================================ */
function exportExcel() {
  if (typeof window.XLSX === 'undefined') {
    toast('Thư viện Excel chưa sẵn sàng — đang xuất CSV dự phòng...', 'var(--warn)');
    exportCSV();
    return;
  }
  const bal = balance();
  const wb = window.XLSX.utils.book_new();

  // Sheet 1: Sổ giao dịch
  const txRows = [['Ngày', 'Loại', 'Ví', 'Danh mục', 'Đợt thu', 'Số tiền (đ)', 'Người nộp', 'Ghi chú', 'Hóa đơn', 'Loại phiếu', 'Trạng thái']];
  DB.transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const w = (t.wallet || t.account) === 'cash' ? 'Tiền mặt' : 'Chuyển khoản';
    const dObj = t.driveId ? DB.drives.find(d => d.id === t.driveId) : null;
    txRows.push([
      t.date,
      t.type === 'in' ? 'Thu' : 'Chi',
      w,
      t.categoryName || '',
      dObj ? dObj.name : '',
      Number(t.amount) || 0,
      t.member || '',
      t.note || '',
      t.receipt ? 'Có ảnh đính kèm' : 'Không',
      (t.isAdjustment || t.category === 'adjust') ? 'Điều chỉnh kiểm kê' : 'Thường',
      t.status === 'draft' ? 'Nháp' : 'Đã ghi'
    ]);
  });
  const wsTx = window.XLSX.utils.aoa_to_sheet(txRows);
  wsTx['!cols'] = [
    { wch: 12 }, { wch: 8 }, { wch: 15 }, { wch: 18 }, { wch: 20 },
    { wch: 15 }, { wch: 22 }, { wch: 36 }, { wch: 16 }, { wch: 20 }, { wch: 12 }
  ];
  window.XLSX.utils.book_append_sheet(wb, wsTx, 'So_Giao_Dich');

  // Sheet 2: Tổng hợp số dư 2 ví
  const sumRows = [
    ['Chỉ tiêu', 'Số tiền (đ)'],
    ['Ví Tiền mặt', bal.cash],
    ['Ví Chuyển khoản', bal.bank],
    ['Tổng số dư quỹ lớp', bal.total],
    ['Ngày xuất báo cáo', todayISO()]
  ];
  const wsSum = window.XLSX.utils.aoa_to_sheet(sumRows);
  wsSum['!cols'] = [{ wch: 26 }, { wch: 18 }];
  window.XLSX.utils.book_append_sheet(wb, wsSum, 'Tong_Hop_Vi');

  // Sheet 3: Tình hình đóng quỹ theo từng Đợt thu
  const memHeader = ['Mã TV', 'Họ và tên', ...DB.drives.map(d => `${d.name} (${fmtMoney(d.amount)})`)];
  const memRows = [memHeader];
  DB.members.forEach(m => {
    const row = [m.code || '', m.name];
    DB.drives.forEach(d => {
      const st = getMemberDriveStatus(m.id, d.id);
      if (st.isFullyPaid) row.push(`Đã đóng (${fmtMoney(st.paidAmount)})`);
      else if (st.isPartial) row.push(`Thiếu ${fmtMoney(st.remaining)}`);
      else row.push(`Chưa đóng (${fmtMoney(st.remaining)})`);
    });
    memRows.push(row);
  });
  const wsMem = window.XLSX.utils.aoa_to_sheet(memRows);
  wsMem['!cols'] = [{ wch: 10 }, { wch: 26 }, ...DB.drives.map(() => ({ wch: 24 }))];
  window.XLSX.utils.book_append_sheet(wb, wsMem, 'Thu_Quy_Theo_Dot');

  window.XLSX.writeFile(wb, `SoQuyLop_${todayISO()}.xlsx`);
  toast('📊 Đã xuất file Excel (.xlsx) thành công!', 'var(--income)');
}

function exportCSV() {
  if (DB.transactions.length === 0) { toast('Chưa có giao dịch nào để xuất'); return; }

  const sanitize = (str) => {
    const s = String(str || '');
    return /^[=+\-@]/.test(s) ? "'" + s : s;
  };

  const rows = [['Ngày','Loại','Danh mục','Số tiền','Ví','Người nộp','Ghi chú','Trạng thái']];
  DB.transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const w = (t.wallet || t.account) === 'cash' ? 'Tiền mặt' : 'Chuyển khoản';
    rows.push([t.date, t.type === 'in' ? 'Thu' : 'Chi', sanitize(t.categoryName), t.amount,
      w, sanitize(t.member), sanitize(t.note),
      t.status === 'draft' ? 'Nháp' : 'Đã ghi']);
  });
  const csvBody = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const csv = `sep=;\r\n${csvBody}`;
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `so-quy-lop-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Đã xuất CSV — mở bằng Excel nhé');
}

/* ============================================================
   22. VIEWS + INIT
============================================================ */
const VIEWS = {
  home: renderHome, ledger: renderLedger, check: renderCheck,
  reports: renderReports, settings: renderSettings,
};

function showAuthScreen() {
  $('#authScreen').hidden = false;
  $('#appShell').hidden = true;
  closeSheet();
  resetAuthForm();
}
function showAppShell() {
  $('#authScreen').hidden = true;
  $('#appShell').hidden = false;
}

function enterApp(user) {
  currentUser = user;
  DB = loadUserDB(user.username);
  recomputeAllDrivesFromTransactions();
  balanceHidden = !!DB.settings.hideBalance;
  document.documentElement.dataset.theme = DB.settings.theme || 'giay-cu';
  saveSession(user);
  showAppShell();
  initRealtimeSync();
  navigate('home');
}

function doLogout() {
  try { if (currentUser && DB) saveDB(); } catch(e) {}
  if (firestoreUnsub) { firestoreUnsub(); firestoreUnsub = null; }
  clearSession();
  currentUser = null; DB = null;
  showAuthScreen();
  toast('Đã đăng xuất');
}

let authMode = 'login';
function setAuthMode(mode) {
  authMode = mode;
  $$('.auth-tab').forEach(t => {
    const active = t.dataset.mode === mode;
    t.style.background = active ? 'var(--accent)' : 'transparent';
    t.style.color = active ? 'var(--on-accent)' : 'var(--text-2)';
  });
  $('#authConfirmWrap').classList.toggle('hidden', mode !== 'register');
  $('#authSubmit').textContent = mode === 'login' ? 'Đăng nhập' : 'Đăng ký & bắt đầu';
  hideAuthError();
}
function hideAuthError() { $('#authError').classList.add('hidden'); $('#authError').textContent = ''; }
function showAuthError(msg) { $('#authError').textContent = msg; $('#authError').classList.remove('hidden'); }
function resetAuthForm() {
  $('#authUsername').value = '';
  $('#authPassword').value = '';
  $('#authPassword2').value = '';
  hideAuthError();
  setAuthMode('login');
  setTimeout(() => $('#authUsername')?.focus(), 100);
}

$('#tabLogin').onclick = () => setAuthMode('login');
$('#tabRegister').onclick = () => setAuthMode('register');

$('#authForm').onsubmit = (e) => {
  e.preventDefault();
  hideAuthError();
  const username = $('#authUsername').value.trim();
  const password = $('#authPassword').value.trim();
  const password2 = $('#authPassword2').value.trim();

  if (!username) { showAuthError('Vui lòng nhập tên đăng nhập'); return; }
  if (!password) { showAuthError('Vui lòng nhập mật khẩu'); return; }

  if (authMode === 'login') {
    const r = verifyLogin(username, password);
    if (!r.ok) { showAuthError(r.error); return; }
    enterApp(r.user);
  } else {
    if (password !== password2) { showAuthError('Mật khẩu xác nhận không khớp (có thể do bàn phím tự cách)'); return; }
    const r = registerUser(username, password);
    if (!r.ok) { showAuthError(r.error); return; }
    enterApp(r.user);
    toast(`Chào mừng ${r.user.username}! Bắt đầu thôi 🌿`, 'var(--income)');
  }
};

function init() {
  if (isViewOnlyMode() && !isAdminUnlocked) {
    enterPublicGuestView();
    return;
  }
  const user = loadSession();
  if (user) {
    isPublicGuestMode = false;
    enterApp(user);
  } else {
    showAuthScreen();
  }
}

init();

function syncOnResume() {
  if (document.hidden) return;
  if (!navigator.onLine) {
    updateSyncBadge('offline');
    return;
  }
  if (isGuestLocked() && activeQrContext && activeQrContext.memberId) {
    reportMemberTransfer(activeQrContext.memberId, activeQrContext.driveId, { silentToast: true });
  }
  if (isGuestLocked() || currentUser) {
    initRealtimeSync();
  }
}
document.addEventListener('visibilitychange', syncOnResume);
window.addEventListener('pageshow', syncOnResume);
</script>
