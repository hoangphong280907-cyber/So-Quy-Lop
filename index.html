  [data-theme="dem-yen"]   { --bg:#1E2124; --surface:#262A2E; --surface-2:#2E3338; --border:#383E44;

<script>
/* ============================================================
   0. DOM HELPERS
============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const fmt = n => Math.round(n).toLocaleString('vi-VN');
const fmtMoney = n => fmt(n) + 'đ';
const fmtDiff = d => (d > 0 ? '+' : d < 0 ? '−' : '') + fmt(Math.abs(d)) + 'đ';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ============================================================
   1. SERVICE WORKER + FIREBASE REALTIME & AUTH + GUEST REPORTS
============================================================ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDIXVlSVUZraFH1kWr6aX1eTEDkllMU0nk",
  authDomain: "so-quy-lop.firebaseapp.com",
  projectId: "so-quy-lop",
  storageBucket: "so-quy-lop.firebasestorage.app",
  messagingSenderId: "751184406875",
  appId: "1:751184406875:web:5ac921e3353987ce38d27e"
};

const BANK_OPTIONS = [
  { code: 'BIDV', name: 'BIDV (970418)' },
  { code: 'VCB',  name: 'Vietcombank (970436)' },
  { code: 'MB',   name: 'MB Bank (970422)' },
  { code: 'TCB',  name: 'Techcombank (970407)' },
  { code: 'ICB',  name: 'VietinBank (970415)' },
  { code: 'VBA',  name: 'Agribank (970405)' },
  { code: 'ACB',  name: 'ACB (970416)' },
  { code: 'TPB',  name: 'TPBank (970423)' },
  { code: 'VPB',  name: 'VPBank (970432)' },
  { code: 'STB',  name: 'Sacombank (970403)' },
];

let firestoreDb = null;
let firebaseAuth = null;
let firebaseAuthUser = null;
let firestoreUnsub = null;
let isAdminUnlocked = sessionStorage.getItem('sq_pin_ok') === '1';
let isApplyingRemoteSnapshot = false;
let isPublicGuestMode = false;
let syncBadgeState = navigator.onLine ? 'synced' : 'offline';
let remoteGuestReports = {};
let activeQrContext = null; // { memberId, driveId, memberName }

const DEFAULT_SHARED_ROOM = 'lop_chinh';

function getRoomId() {
  const paramRoom = new URLSearchParams(location.search).get('room');
  return (paramRoom && paramRoom.trim()) ? paramRoom.trim() : DEFAULT_SHARED_ROOM;
}

function isViewOnlyMode() {
  return new URLSearchParams(location.search).get('view') === '1';
}

function getSyncBadgeMeta(state) {
  if (!navigator.onLine || state === 'offline') {
    return {
      text: '🔴 Offline (Lưu tạm trên máy)',
      bg: '#FBF0EE',
      color: '#B56A5E',
      border: '#E6C5BF'
    };
  }
  if (state === 'syncing') {
    return {
      text: '🟡 Đang đồng bộ...',
      bg: '#FBF6EC',
      color: '#B07438',
      border: '#E7D5B8'
    };
  }
  return {
    text: '🟢 Đã đồng bộ',
    bg: 'var(--accent-soft)',
    color: 'var(--income)',
    border: 'var(--border)'
  };
}

function updateSyncBadge(state) {
  if (!navigator.onLine) state = 'offline';
  syncBadgeState = state || 'synced';
  const badge = $('#syncBadge');
  if (!badge) return;
  const meta = getSyncBadgeMeta(syncBadgeState);
  badge.textContent = meta.text;
  badge.style.backgroundColor = meta.bg;
  badge.style.color = meta.color;
  badge.style.borderColor = meta.border;
}

window.addEventListener('online', () => {
  updateSyncBadge('syncing');
  if (firestoreDb && (currentUser || isPublicGuestMode)) {
    initRealtimeSync();
  }
});
window.addEventListener('offline', () => {
  updateSyncBadge('offline');
});

function ensureFirestoreInstance() {
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId) return null;
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  if (!firebaseAuth && typeof firebase.auth === 'function') {
    firebaseAuth = firebase.auth();
    firebaseAuth.onAuthStateChanged((u) => {
      firebaseAuthUser = u || null;
      if (currentView === 'settings') render();
    });
  }
  if (!firestoreDb) {
    firestoreDb = firebase.firestore();
    firestoreDb.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  }
  return firestoreDb;
}

function mergeRemoteGuestReportsIntoDB(reportsMap) {
  if (!DB || !reportsMap || typeof reportsMap !== 'object') return false;
  let changed = false;
  Object.entries(reportsMap).forEach(([key, ts]) => {
    if (!ts) return;
    const sepIdx = key.lastIndexOf('__');
    if (sepIdx <= 0) return;
    const driveId = key.slice(0, sepIdx);
    const memberId = key.slice(sepIdx + 2);
    const drive = getDriveById(driveId);
    if (!drive) return;
    const st = getMemberDriveStatus(memberId, drive.id);
    if (st.isFullyPaid) return;
    if (!drive.pending) drive.pending = {};
    if (!drive.pending[memberId] || Number(ts) > Number(drive.pending[memberId])) {
      drive.pending[memberId] = Number(ts) || Date.now();
      changed = true;
    }
  });
  syncLegacyMirrorsFromActiveDrive();
  return changed;
}

function initRealtimeSync() {
  if (firestoreUnsub) { firestoreUnsub(); firestoreUnsub = null; }
  if (!navigator.onLine) updateSyncBadge('offline');
  try {
    const dbInst = ensureFirestoreInstance();
    if (!dbInst) return;

    const roomId = getRoomId();
    firestoreUnsub = dbInst.collection('so_quy_rooms').doc(roomId).onSnapshot({ includeMetadataChanges: true }, (snap) => {
      if (!navigator.onLine) {
        updateSyncBadge('offline');
      } else if (snap.metadata && snap.metadata.hasPendingWrites) {
        updateSyncBadge('syncing');
      } else {
        updateSyncBadge('synced');
      }

      if (!snap.exists) return;
      const remote = snap.data();
      if (!remote) return;
      remoteGuestReports = (remote.guestReports && typeof remote.guestReports === 'object') ? { ...remote.guestReports } : {};

      const localStamp = DB?._updatedAt || 0;
      const shouldApplyRemoteDb = remote.db && (isPublicGuestMode || (remote.updatedAt || 0) > localStamp);

      isApplyingRemoteSnapshot = true;
      if (shouldApplyRemoteDb) {
        DB = normalizeDB(remote.db);
        DB._updatedAt = remote.updatedAt || Date.now();
      }
      const hasNewGuestReports = mergeRemoteGuestReportsIntoDB(remoteGuestReports);

      if (shouldApplyRemoteDb || hasNewGuestReports) {
        if (currentUser && !isPublicGuestMode) {
          safeStorage.setItem(userDBKey(currentUser.username), JSON.stringify(DB));
        }
        balanceHidden = !!DB.settings.hideBalance;
        document.documentElement.dataset.theme = DB.settings.theme || 'giay-cu';
        if (currentUser || isPublicGuestMode) {
          render();
          if (isGuestLocked()) {
            const prevQ = $('#memberSearchInp')?.value || '';
            const hadFocus = document.activeElement?.id === 'memberSearchInp';
            openMembersSheet();
            if (prevQ && $('#memberSearchInp')) {
              $('#memberSearchInp').value = prevQ;
              $('#memberSearchInp').dispatchEvent(new Event('input'));
              if (hadFocus) $('#memberSearchInp').focus();
            }
          } else if ($('#sheetOverlay')?.classList.contains('open') && $('#memberRowsContainer')) {
            renderMembersSheet();
          }
        }
      }
      isApplyingRemoteSnapshot = false;
    }, (err) => {
      console.warn('Firestore sync:', err);
      if (!navigator.onLine) updateSyncBadge('offline');
    });
  } catch (e) {
    isApplyingRemoteSnapshot = false;
    console.warn('Firebase init skipped:', e);
  }
}

function isGuestLocked() {
  return isViewOnlyMode() && !isAdminUnlocked;
}

function pushCloudDB(forceAllow = false) {
  if (isApplyingRemoteSnapshot || !DB) return;
  if (!currentUser && !isPublicGuestMode) return;
  if (isGuestLocked() && !forceAllow) return;
  try {
    const dbInst = ensureFirestoreInstance();
    if (!dbInst) return;
    updateSyncBadge(navigator.onLine ? 'syncing' : 'offline');
    const roomId = getRoomId();
    dbInst.collection('so_quy_rooms').doc(roomId).set({
      db: DB,
      guestReports: remoteGuestReports,
      updatedAt: DB._updatedAt || Date.now(),
      owner: currentUser ? currentUser.username : (DB._owner || 'public_room')
    }, { merge: true }).then(() => {
      if (navigator.onLine) updateSyncBadge('synced');
    }).catch((err) => {
      console.error('Firestore write error:', err);
      if (err && (err.code === 'permission-denied' || String(err).includes('PERMISSION_DENIED'))) {
        toast('🔒 PERMISSION_DENIED: Chỉ tài khoản Thủ quỹ mới có quyền ghi dữ liệu!', 'var(--warn)');
      }
      if (!navigator.onLine) updateSyncBadge('offline');
    });
  } catch (e) {}
}

// Khách tự động báo "Tôi đã CK" (ghi vào trường guestReports để Rules cho phép kể cả khi khóa ghi db chính)
function pushGuestTransferReport(driveId, memberId, ts) {
  const key = `${driveId}__${memberId}`;
  if (ts) remoteGuestReports[key] = ts;
  else delete remoteGuestReports[key];

  try {
    const dbInst = ensureFirestoreInstance();
    if (!dbInst) return;
    const roomId = getRoomId();
    const fieldPath = new firebase.firestore.FieldPath('guestReports', key);
    const val = ts ? ts : firebase.firestore.FieldValue.delete();
    dbInst.collection('so_quy_rooms').doc(roomId).update(fieldPath, val).catch(() => {
      dbInst.collection('so_quy_rooms').doc(roomId).set({
        guestReports: { [key]: ts || null }
      }, { merge: true }).catch(() => {});

}

/* ============================================================
   2. ĐỢT THU / SỰ KIỆN RIÊNG & ĐỒNG BỘ 2 CHIỀU THU QUỸ <-> GHI NHANH
============================================================ */
function stripVietnamese(str) {
  return String(str || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .replace(/[^a-zA-Z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function buildDriveShortCode(name) {
  const clean = stripVietnamese(name || '').toUpperCase();
  const mMonth = clean.match(/THANG\s*(\d{1,2})|\bT(\d{1,2})\b/);
  if (mMonth) return `T${mMonth[1] || mMonth[2]}`;
  const words = clean.split(/\s+/).filter(Boolean);
  if (!words.length) return 'QUY';
  if (words.length === 1) return words[0].slice(0, 10);
  return words.map(w => (/^\d+$/.test(w) ? w : w[0])).join('').slice(0, 10);
}

const VI_ALPHA_ORDER = [
  'a','ă','â','b','c','d','đ','e','ê','g','h','i','k','l','m',
  'n','o','ô','ơ','p','q','r','s','t','u','ư','v','x','y'
];
const VI_CHAR_RANK = (() => {
  const map = new Map();
  VI_ALPHA_ORDER.forEach((ch, idx) => map.set(ch, idx + 1));
  return map;
})();

function normalizeViWord(word) {
  const lower = String(word || '').trim().toLowerCase();
  let key = '';
  for (let i = 0; i < lower.length; i++) {
    const ch = lower[i];
    if (VI_CHAR_RANK.has(ch)) {
      key += String.fromCharCode(65 + VI_CHAR_RANK.get(ch));
      continue;
    }
    const base = ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (base === 'đ') key += String.fromCharCode(65 + VI_CHAR_RANK.get('đ'));
    else if (VI_CHAR_RANK.has(base)) key += String.fromCharCode(65 + VI_CHAR_RANK.get(base));
    else key += ch;
  }
  return key;
}

function getNameSortParts(fullName) {
  const tokens = String(fullName || '').trim().split(/\s+/).filter(Boolean);
  if (!tokens.length) return { given: '', middle: '', family: '', raw: '' };
  if (tokens.length === 1) {
    return {
      given: normalizeViWord(tokens[0]),
      middle: '',
      family: '',
      raw: tokens[0].toLowerCase()
    };
  }
  const family = normalizeViWord(tokens[0]);
  const given = normalizeViWord(tokens[tokens.length - 1]);
  const middle = tokens.slice(1, -1).map(normalizeViWord).join(' ');
  return {
    given,
    middle,
    family,
    raw: tokens.join(' ').toLowerCase()
  };
}

function compareVietnameseMembers(a, b) {
  const pa = getNameSortParts(a?.name || '');
  const pb = getNameSortParts(b?.name || '');
  if (pa.given !== pb.given) return pa.given < pb.given ? -1 : 1;
  if (pa.middle !== pb.middle) return pa.middle < pb.middle ? -1 : 1;
  if (pa.family !== pb.family) return pa.family < pb.family ? -1 : 1;
  return pa.raw.localeCompare(pb.raw, 'vi');
}

function sortAndReindexMembers(list) {
  if (!Array.isArray(list)) return [];
  const sorted = list
    .filter(Boolean)
    .slice()
    .sort(compareVietnameseMembers);
  return sorted.map((m, idx) => ({
    ...m,
    code: `TV${String(idx + 1).padStart(2, '0')}`
  }));
}

function ensureMemberCodes(list) {
  return sortAndReindexMembers(list);
}

function getActiveDrive() {
  if (!DB || !Array.isArray(DB.drives) || !DB.drives.length) return null;
  return DB.drives.find(d => d.id === DB.activeDriveId) || DB.drives[0];
}

function getDriveById(driveId) {
  if (!DB || !Array.isArray(DB.drives) || !DB.drives.length) return null;
  if (!driveId) return getActiveDrive();
  return DB.drives.find(d => d.id === driveId) || getActiveDrive();
}

function syncLegacyMirrorsFromActiveDrive() {
  const active = getActiveDrive();
  if (!active || !DB) return;
  DB.activeDriveId = active.id;
  DB.memberPaid = active.paid || {};
  DB.memberPending = active.pending || {};
  if (DB.settings) DB.settings.termFee = Number(active.amount) || 0;
}

function getMemberDriveStatus(memberId, driveId = null) {
  const drive = getDriveById(driveId);
  if (!drive) {
    return { target: 0, paidAmount: 0, remaining: 0, isFullyPaid: false, isPartial: false, pendingTs: null, paidObj: null };
  }
  const target = Math.max(0, Math.round(Number(drive.amount) || 0));
  const paidObj = drive.paid?.[memberId] || null;
  let paidAmount = 0;
  if (paidObj === true) paidAmount = target;
  else if (paidObj && typeof paidObj === 'object') {
    paidAmount = typeof paidObj.amount === 'number' ? paidObj.amount : (paidObj.paid ? target : 0);
  }
  const remaining = Math.max(0, target - paidAmount);
  const isFullyPaid = target > 0 ? paidAmount >= target : !!paidObj;
  const isPartial = !isFullyPaid && paidAmount > 0;
  const pendingTs = !isFullyPaid ? (drive.pending?.[memberId] || null) : null;
  return { target, paidAmount, remaining, isFullyPaid, isPartial, pendingTs, paidObj };
}

function driveStats(driveId = null) {
  const drive = getDriveById(driveId);
  const total = DB.members.length;
  let paid = 0, partial = 0, pending = 0, collected = 0, expected = 0;
  const target = drive ? Math.max(0, Math.round(Number(drive.amount) || 0)) : 0;
  for (const m of DB.members) {
    const st = getMemberDriveStatus(m.id, drive?.id);
    expected += target;
    collected += Math.min(target, st.paidAmount);
    if (st.isFullyPaid) paid++;
    else {
      if (st.isPartial) partial++;
      if (st.pendingTs) pending++;
    }
  }
  return {
    total,
    paid,
    partial,
    pending,
    unpaid: total - paid,
    collected,
    expected,
    shortfall: Math.max(0, expected - collected)
  };
}

// Đồng bộ tự động từ Ghi nhanh -> Thu quỹ khi có giao dịch Thu gắn với thành viên
function recomputeAllDrivesFromTransactions() {
  if (!DB || !Array.isArray(DB.drives)) return;
  const defaultDriveId = DB.drives[0]?.id || 'drive_default';
  const memberByName = new Map();
  DB.members.forEach(m => {
    memberByName.set(m.name.trim().toLowerCase(), m);
  });

  const txSumMap = {}; // `${driveId}__${memberId}` -> { amount, latestTs, latestDate, latestTxId }
  for (const t of DB.transactions) {
    if (t.status !== 'done' || t.type !== 'in') continue;
    const rawName = (t.member || '').trim().toLowerCase();
    if (!rawName) continue;
    const mem = memberByName.get(rawName);
    if (!mem) continue;
    const targetDriveId = t.driveId || (t.category === 'quy' ? defaultDriveId : null);
    if (!targetDriveId) continue;
    const driveObj = DB.drives.find(d => d.id === targetDriveId);
    if (!driveObj) continue;

    const k = `${driveObj.id}__${mem.id}`;
    if (!txSumMap[k]) {
      txSumMap[k] = { amount: 0, latestTs: 0, latestDate: t.date, latestTxId: t.id };
    }
    txSumMap[k].amount += Math.max(0, Math.round(Number(t.amount) || 0));
    if ((t.createdAt || 0) >= txSumMap[k].latestTs) {
      txSumMap[k].latestTs = t.createdAt || Date.now();
      txSumMap[k].latestDate = t.date || todayISO();
      txSumMap[k].latestTxId = t.id;
    }
  }

  for (const drive of DB.drives) {
    if (!drive.paid) drive.paid = {};
    if (!drive.pending) drive.pending = {};
    const target = Math.max(0, Math.round(Number(drive.amount) || 0));

    for (const mem of DB.members) {
      const k = `${drive.id}__${mem.id}`;
      const agg = txSumMap[k];
      const existing = drive.paid[mem.id];

      if (agg && agg.amount > 0) {
        const isFull = target > 0 ? agg.amount >= target : true;
        const ts = (existing && typeof existing === 'object' && existing.paidAt) ? existing.paidAt : (agg.latestTs || Date.now());
        drive.paid[mem.id] = {
          paid: isFull,
          partial: !isFull,
          amount: agg.amount,
          date: agg.latestDate || todayISO(),
          paidAt: ts,
          paidAtStr: (existing && typeof existing === 'object' && existing.paidAtStr) ? existing.paidAtStr : formatExactDateTime(ts),
          txId: agg.latestTxId,
          syncedFromTx: true
        };
        if (isFull && drive.pending[mem.id]) {
          delete drive.pending[mem.id];
          delete remoteGuestReports[`${drive.id}__${mem.id}`];
        }
      } else if (existing && typeof existing === 'object' && existing.syncedFromTx) {
        delete drive.paid[mem.id];
      }
    }
  }
  syncLegacyMirrorsFromActiveDrive();
}

function formatTransferMemo(template, memberName, memberCode = '', drive = null) {
  const dObj = drive || getActiveDrive();
  const cleanName = stripVietnamese(memberName || '');
  const cleanCode = stripVietnamese(memberCode || '').toUpperCase();
  const cleanDrive = stripVietnamese(dObj?.shortCode || buildDriveShortCode(dObj?.name || 'QUY')).toUpperCase();
  const raw = (template !== undefined && template !== null && String(template).trim() !== '')
    ? String(template)
    : '{ten} dong quy {dot}';
  const replaced = raw
    .replace(/\{ten\}/gi, cleanName)
    .replace(/\{(ma|stt)\}/gi, cleanCode)
    .replace(/\{(dot|sukien)\}/gi, cleanDrive);
  return stripVietnamese(replaced).slice(0, 50);
}

function buildVietQrUrl({ bankCode, accountNo, accountName, amount, customMemo }) {
  const bank = String(bankCode || 'BIDV').trim().toUpperCase();
  const stk = String(accountNo || '').replace(/\s+/g, '');
  if (!stk) return '';
  const memo = encodeURIComponent(String(customMemo || '').trim());
  const holder = encodeURIComponent(stripVietnamese(accountName || '').toUpperCase());
  const money = Math.max(0, Math.round(Number(amount) || 0));
  return `https://img.vietqr.io/image/${bank}-${stk}-compact2.png?amount=${money}&addInfo=${memo}&accountName=${holder}`;
}

function formatExactDateTime(ts = Date.now()) {
  const d = new Date(ts);
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}

function getMemberPaidLabel(memberId, driveId = null) {
  const st = getMemberDriveStatus(memberId, driveId);
  if (!st.paidObj) return '';
  if (typeof st.paidObj === 'object' && st.paidObj.paidAtStr) return st.paidObj.paidAtStr;
  return 'Đã đóng';
}

function reportMemberTransfer(memberId, driveId = null, options = {}) {
  const drive = getDriveById(driveId);
  if (!DB || !memberId || !drive) return false;
  const m = DB.members.find(x => x.id === memberId);
  if (!m) return false;
  const st = getMemberDriveStatus(memberId, drive.id);
  if (st.isFullyPaid) {
    if (!options.silentToast) toast(`${m.name} đã được xác nhận đóng đủ đợt này rồi`, 'var(--income)');
    return false;
  }
  const now = Date.now();
  if (!drive.pending) drive.pending = {};
  const alreadyReported = !!drive.pending[memberId];
  if (!alreadyReported || options.forceUpdate) {
    drive.pending[memberId] = now;
  }
  syncLegacyMirrorsFromActiveDrive();
  DB._updatedAt = now;
  if (currentUser && !isPublicGuestMode) {
    safeStorage.setItem(userDBKey(currentUser.username), JSON.stringify(DB));
  }
  pushGuestTransferReport(drive.id, memberId, drive.pending[memberId]);
  if (!isGuestLocked()) pushCloudDB();

  if (!options.silentToast) {
    toast(`Đã tự động điền "Tôi đã CK" cho ${m.name} — chờ thủ quỹ duyệt`, 'var(--income)');
  }
  if ($('#sheetOverlay')?.classList.contains('open') && $('#memberRowsContainer')) {
    renderMembersSheet();
  }
  if (currentView === 'home') render();
  return true;
}

function cancelMemberTransferReport(memberId, driveId = null) {
  const drive = getDriveById(driveId);
  if (!DB || !memberId || !drive) return;
  if (drive.pending) delete drive.pending[memberId];
  syncLegacyMirrorsFromActiveDrive();
  pushGuestTransferReport(drive.id, memberId, null);
  if (!isGuestLocked()) pushCloudDB();
  toast('Đã huỷ trạng thái báo chuyển khoản');
  if ($('#sheetOverlay')?.classList.contains('open') && $('#memberRowsContainer')) {
    renderMembersSheet();
  }
  if (currentView === 'home') render();
}

function setMemberPaidStatus(memberId, shouldPay, options = {}) {
  const drive = getDriveById(options.driveId);
  if (!drive) return;
  const m = DB.members.find(x => x.id === memberId);
  if (!m) return;
  if (!drive.paid) drive.paid = {};
  if (!drive.pending) drive.pending = {};
  DB.paymentLogs = Array.isArray(DB.paymentLogs) ? DB.paymentLogs : [];

  const today = todayISO();
  const st = getMemberDriveStatus(memberId, drive.id);
  const wasPending = !!drive.pending[memberId];

  if (shouldPay) {
    const now = Date.now();
    const paidAtStr = formatExactDateTime(now);
    const collectAmt = st.remaining > 0 ? st.remaining : Math.max(0, Math.round(Number(drive.amount) || 0));
    const totalNow = st.paidAmount + collectAmt;
    const autoTxId = `drive_${drive.id}_${memberId}_${now}`;

    drive.paid[memberId] = {
      paid: true,
      partial: false,
      amount: totalNow,
      date: today,
      paidAt: now,
      paidAtStr,
      txId: autoTxId,
      syncedFromTx: true
    };
    delete drive.pending[memberId];
    pushGuestTransferReport(drive.id, memberId, null);

    DB.paymentLogs.unshift({
      id: `log_${now}_${memberId}`,
      driveId: drive.id,
      driveName: drive.name,
      memberId,
      memberCode: m.code || '',
      memberName: m.name,
      amount: collectAmt,
      date: today,
      paidAt: now,
      paidAtStr
    });

    if (collectAmt > 0) {
      const walletUsed = options.wallet || (wasPending ? 'bank' : 'cash');
      DB.transactions.push({
        id: autoTxId,
        type: 'in',
        amount: collectAmt,
        category: 'quy',
        categoryName: 'Quỹ lớp',
        driveId: drive.id,
        wallet: walletUsed,
        account: walletUsed,
        date: today,
        member: m.name,
        note: `Thu ${drive.name} · ${m.name}`,
        receipt: null,
        status: 'done',
        createdAt: now
      });
    }
    syncLegacyMirrorsFromActiveDrive();
    if (!options.silent) {
      toast(`✓ Đã duyệt ${m.name} (${fmtMoney(collectAmt)}) vào ví ${wasPending ? 'Chuyển khoản' : 'Tiền mặt'}`, 'var(--income)');
    }
  } else {
    delete drive.paid[memberId];
    DB.paymentLogs = DB.paymentLogs.filter(x => !(x.memberId === memberId && (x.driveId || 'drive_default') === drive.id));
    const beforeLen = DB.transactions.length;
    DB.transactions = DB.transactions.filter(t => {
      const sameMember = (t.member || '').trim().toLowerCase() === m.name.trim().toLowerCase();
      const sameDrive = (t.driveId || (t.category === 'quy' ? (DB.drives[0]?.id || 'drive_default') : null)) === drive.id;
      return !(sameMember && sameDrive && t.type === 'in');
    });
    syncLegacyMirrorsFromActiveDrive();
    if (!options.silent) {
      toast(DB.transactions.length < beforeLen
        ? `Đã hoàn tác ${m.name} & trừ khoản thu khỏi Sổ quỹ`
        : `Đã chuyển ${m.name} về Chưa đóng`);
    }
  }
}

   3. VIETQR ĐỘNG + TỰ ĐỘNG ĐIỀN "TÔI ĐÃ CK" KHI KHÁCH QUÉT QR

function openReceiptModal(src, caption = 'Ảnh hóa đơn / minh chứng') {

function estimateDataUrlBytes(dataUrl) {
  if (!dataUrl) return 0;
  const commaIdx = dataUrl.indexOf(',');
  const b64 = commaIdx >= 0 ? dataUrl.slice(commaIdx + 1) : dataUrl;
  return Math.round((b64.length * 3) / 4);
}

// Nén ảnh hóa đơn qua HTML5 Canvas đảm bảo dung lượng < 100KB
function compressReceiptUnder100KB(file, callback) {
  const MAX_BYTES = 96 * 1024;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const dimensions = [900, 720, 560, 440];
      const qualities = [0.75, 0.6, 0.48, 0.36, 0.28];
      let bestDataUrl = '';
      let bestSize = Infinity;

      for (const maxDim of dimensions) {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height / width) * maxDim); width = maxDim; }
          else { width = Math.round((width / height) * maxDim); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        for (const q of qualities) {
          const dataUrl = canvas.toDataURL('image/jpeg', q);
          const bytes = estimateDataUrlBytes(dataUrl);
          if (bytes < bestSize) {
            bestSize = bytes;
            bestDataUrl = dataUrl;
          }
          if (bytes <= MAX_BYTES) {
            callback(dataUrl, Math.max(1, Math.round(bytes / 1024)));
            return;
          }
        }
      }
      callback(bestDataUrl, Math.max(1, Math.round(bestSize / 1024)));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function hashPassword(pw) {
  let h = 5381;
  for (let i = 0; i < pw.length; i++) h = ((h << 5) + h + pw.charCodeAt(i)) >>> 0;
  let h2 = 2166136261;
  for (let i = 0; i < pw.length; i++) { h2 ^= pw.charCodeAt(i); h2 = Math.imul(h2, 16777619) >>> 0; }
  return h.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

function loadUsers() {
  try { const raw = safeStorage.getItem(AUTH_USERS_KEY); return raw ? JSON.parse(raw) : []; }
  catch { return []; }
}
function saveUsers(users) { safeStorage.setItem(AUTH_USERS_KEY, JSON.stringify(users)); }
function findUser(username) { return loadUsers().find(u => u.username.toLowerCase() === String(username).toLowerCase()); }

function registerUser(username, password) {
  username = username.trim();
  if (findUser(username)) return { ok: false, error: 'Tên đăng nhập đã tồn tại' };
  if (username.length < 2) return { ok: false, error: 'Tên dài tý đê, ít nhất 2 ký tự' };
  if (password.length < 2) return { ok: false, error: 'Mật khẩu ít nhất 2 ký tự' };

  const user = { username, passwordHash: hashPassword(password), createdAt: Date.now() };
  const users = loadUsers(); users.push(user); saveUsers(users);
  return { ok: true, user };
}

function verifyLogin(username, password) {
  const user = findUser(username);
  if (!user) return { ok: false, error: 'Không tìm thấy tài khoản này trên máy' };
  if (user.passwordHash !== hashPassword(password)) return { ok: false, error: 'Sai mật khẩu' };
  return { ok: true, user };
}

function normalizeDB(parsed) {
  const base = emptyDB();
  const out = Object.assign(base, parsed || {});
  out.transactions = Array.isArray(out.transactions)
    ? out.transactions.map(t => {
        const w = (t && (t.wallet || t.account)) || 'cash';
        return {
          ...t,
          wallet: w,
          account: w,
          status: t.status || 'done',
          date: t.date || todayISO(),
          categoryName: t.categoryName || t.category || 'Khác'
        };
      })
    : [];
  out.cashChecks = Array.isArray(out.cashChecks) ? out.cashChecks : [];
  out.members = ensureMemberCodes(Array.isArray(out.members) ? out.members : []);
  out.paymentLogs = Array.isArray(out.paymentLogs) ? out.paymentLogs : [];
  out.settings = Object.assign(base.settings, (parsed && parsed.settings) || {});
  out.settings.bank = Object.assign(base.settings.bank, ((parsed && parsed.settings && parsed.settings.bank) || {}));

  if (!Array.isArray(parsed?.drives) || parsed.drives.length === 0) {
    const legacyFee = Math.max(0, Math.round(Number(out.settings.termFee) || 50000));
    out.drives = [
      {
        id: 'drive_default',
        name: 'Quỹ lớp định kỳ',
        shortCode: 'QUYLOP',
        amount: legacyFee,
        createdAt: Date.now(),
        paid: (parsed?.memberPaid && typeof parsed.memberPaid === 'object') ? { ...parsed.memberPaid } : {},
        pending: (parsed?.memberPending && typeof parsed.memberPending === 'object') ? { ...parsed.memberPending } : {}
      }
    ];
    out.activeDriveId = 'drive_default';
  } else {
    out.drives = parsed.drives.map((d, idx) => ({
      id: d.id || (idx === 0 ? 'drive_default' : uid()),
      name: d.name || `Đợt thu ${idx + 1}`,
      shortCode: d.shortCode || buildDriveShortCode(d.name || `DOT${idx + 1}`),
      amount: Math.max(0, Math.round(Number(d.amount) || 0)),
      createdAt: d.createdAt || Date.now(),
      paid: (d.paid && typeof d.paid === 'object') ? { ...d.paid } : {},
      pending: (d.pending && typeof d.pending === 'object') ? { ...d.pending } : {}
    }));
    out.activeDriveId = out.drives.some(d => d.id === parsed.activeDriveId)
      ? parsed.activeDriveId
      : out.drives[0].id;
  }

  const prevDB = DB;
  DB = out;
  recomputeAllDrivesFromTransactions();
  if (prevDB) DB = prevDB;
  return out;
}

function handleRestoreJSON(fileInputEvent, onConfirmRestore) {
  const file = fileInputEvent?.target?.files?.[0];
  if (!file) return;
  if (!requirePinIfNeeded()) {
    fileInputEvent.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const isValidApp = parsed && (parsed.app === 'SoQuyLop' || parsed.app === 'so-quy-lop');
      if (!isValidApp || !parsed.data || !Array.isArray(parsed.data.transactions)) {
        alert('File không đúng định dạng sao lưu của Sổ Quỹ Lớp!');
        return;
      }
      const membersArr = Array.isArray(parsed.data.members) ? parsed.data.members : [];
      const drivesArr = Array.isArray(parsed.data.drives) ? parsed.data.drives : [];
      const exportedDateStr = parsed.exportedAt
        ? new Date(parsed.exportedAt).toLocaleString('vi-VN')
        : 'không rõ thời gian';
      const msg = `Khôi phục bản sao lưu ngày ${exportedDateStr}?\n`
                + `- Đợt thu: ${drivesArr.length || 1}\n`
                + `- Thành viên: ${membersArr.length}\n`
                + `- Giao dịch: ${parsed.data.transactions.length}\n`
                + `(Dữ liệu hiện tại sẽ được thay thế)`;
      if (confirm(msg)) {
        if (typeof onConfirmRestore === 'function') {
          onConfirmRestore(parsed.data);
        } else {
          DB = normalizeDB(parsed.data);
          balanceHidden = !!DB.settings.hideBalance;
          document.documentElement.dataset.theme = DB.settings.theme || 'giay-cu';
          saveDB();
          render();
          toast('Đã khôi phục nguyên trạng từ file JSON', 'var(--income)');
        }
      }
    } catch (err) {
      alert('Lỗi đọc file JSON: File bị hỏng hoặc sai cú pháp.');
    } finally {
      fileInputEvent.target.value = '';
    }
  };
  reader.readAsText(file);
}

function createReconcileTransaction(wallet, bookBalance, actualBalance, reason) {
  const diff = actualBalance - bookBalance;
  if (diff === 0) return null;
  const walletLabel = wallet === 'cash' ? 'Tiền mặt' : 'Chuyển khoản';

  return {
    id: 'adj_' + Date.now() + '_' + wallet,
    type: diff > 0 ? 'in' : 'out',
    isAdjustment: true,
    wallet: wallet,
    account: wallet,
    category: 'adjust',
    categoryName: 'Điều chỉnh kiểm kê',
    amount: Math.abs(diff),
    date: todayISO(),
    member: '',
    note: `[Lệch ${walletLabel} ${diff > 0 ? '+' : ''}${diff.toLocaleString('vi-VN')}đ] ${reason.trim()}`,
    receipt: null,
    status: 'done',
    createdAt: Date.now()
  };
}

function balance() {
  const done = DB.transactions.filter(t => t.status === 'done');
  let cash = 0, bank = 0;
  for (const t of done) {
    const w = t.wallet || t.account || 'cash';
    const v = t.type === 'in' ? t.amount : -t.amount;
    if (w === 'cash') cash += v; else bank += v;
  }
  return { cash, bank, total: cash + bank };
}
function monthStats(iso = todayISO()) {
  const prefix = iso.slice(0, 7);
  let income = 0, expense = 0;
  for (const t of DB.transactions) {
    if (t.status === 'done' && t.date.startsWith(prefix)) {
      if (t.type === 'in') income += t.amount; else expense += t.amount;
    }
  }
  return { income, expense, net: income - expense };
}
function categoryBreakdown(type, iso = todayISO()) {
  const prefix = iso.slice(0, 7);
  const map = {};
  for (const t of DB.transactions) {
    if (t.status === 'done' && t.type === type && t.date.startsWith(prefix)) {
      const k = t.category || 'other';
      map[k] = (map[k] || 0) + t.amount;
    }
  }
  return map;
}
function lastMonthsSeries(n = 6) {
  const out = []; const now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const prefix = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    let income = 0, expense = 0;
    for (const t of DB.transactions) {
      if (t.status === 'done' && String(t.date || '').startsWith(prefix)) {
        if (t.type === 'in') income += t.amount; else expense += t.amount;
      }
    }
    out.push({ label: `T${d.getMonth() + 1}`, income, expense });
  }
  return out;
}

/* ============================================================
   9. ROUTER
============================================================ */
function navigate(view) {
  if (isGuestLocked() && view !== 'home') {
    if (!requirePinIfNeeded()) return;
  }
  currentView = view;
  render();
  window.scrollTo(0, 0);
}
function render() {
  if (!currentUser) return;
  renderAppbar();
  const fn = VIEWS[currentView];
  $('#view').innerHTML = fn();
  wireView();
  renderNav();
  if (isGuestLocked() && !$('#sheetOverlay')?.classList.contains('open')) {
    openMembersSheet();
  }
}

/* ============================================================
   11. VIEW: LEDGER
============================================================ */
const ledgerFilter = { type: 'all', account: 'all', month: 'current', drive: 'all', q: '' };

function getFilteredLedger() {
  let list = DB.transactions.slice().sort((a, b) => b.createdAt - a.createdAt);
  if (ledgerFilter.type !== 'all') list = list.filter(t => t.type === ledgerFilter.type);
  if (ledgerFilter.account !== 'all') list = list.filter(t => (t.wallet || t.account) === ledgerFilter.account);
  if (ledgerFilter.month === 'current') list = list.filter(t => isThisMonth(t.date));
  if (ledgerFilter.drive !== 'all') list = list.filter(t => t.driveId === ledgerFilter.drive);
  if (ledgerFilter.q) {
    const q = ledgerFilter.q.toLowerCase();
    list = list.filter(t =>
      (t.note || '').toLowerCase().includes(q) ||
      (t.categoryName || '').toLowerCase().includes(q) ||
      (t.member || '').toLowerCase().includes(q));
  }
  const totalIn = list.filter(t => t.type === 'in' && t.status === 'done').reduce((s, t) => s + t.amount, 0);
  const totalOut = list.filter(t => t.type === 'out' && t.status === 'done').reduce((s, t) => s + t.amount, 0);
  return { list, totalIn, totalOut };
}

function renderLedgerContent() {
  const { list, totalIn, totalOut } = getFilteredLedger();

  const totalsEl = $('#ledgerTotals');
  if (totalsEl) {
    totalsEl.innerHTML = `

      <div class="flex-1"><p class="text-[var(--text-3)]">Tổng chi</p><p class="text-[16px] font-bold tabular-nums text-[var(--expense)]">−${fmt(totalOut)}đ</p></div>
      <div class="flex-1"><p class="text-[var(--text-3)]">Chênh</p><p class="text-[16px] font-bold tabular-nums">${fmtDiff(totalIn - totalOut)}</p></div>

  const listEl = $('#ledgerList');

    listEl.innerHTML = list.length === 0
      ? `<p class="py-12 text-center text-[14px] text-[var(--text-3)]">${DB.transactions.length === 0 ? 'Chưa có giao dịch nào 🌿' : 'Không có giao dịch nào khớp bộ lọc'}</p>`

  }
}

function renderCheckDenoms() {
  const wrap = $('#checkDenomsWrap'); if (!wrap) return;
  wrap.innerHTML = `

        return `<div class="flex items-center gap-2">

          <input type="number" min="0" max="999" inputmode="numeric" value="${c || ''}"
            data-denom="${d}" placeholder="0"
            class="w-16 rounded-lg border border-[var(--border)] bg-[var(--surface)] px-2 py-1.5 text-center text-[14px] tabular-nums outline-none placeholder:text-[var(--text-3)]" />
          <span class="flex-1 text-right text-[13px] tabular-nums text-[var(--text-2)]" data-subtotal="${d}">${fmt(c * d)}đ</span>
        </div>`;
      }).join('')}
    </div>
    <div class="mt-3 flex items-center justify-between border-t border-[var(--border)] pt-3">
      <span class="text-[13px] font-medium">Tổng tiền mặt đếm được</span>
      <span id="checkDenomTotal" class="text-[16px] font-bold tabular-nums">${fmt(computeDenomTotal())}đ</span>
    </div>`;
  $$('[data-denom]', wrap).forEach(inp => {
    inp.oninput = () => {
      const d = parseInt(inp.dataset.denom, 10);
      const c = Math.max(0, parseInt(inp.value, 10) || 0);
      checkState.denoms[d] = c;
      checkState.actualCash = computeDenomTotal();
      $(`[data-subtotal="${d}"]`, wrap).textContent = fmt(c * d) + 'đ';
      $('#checkDenomTotal', wrap).textContent = fmt(checkState.actualCash) + 'đ';
      updateCheckDiff();
    };
  });
}
function computeDenomTotal() { return DENOMS.reduce((s, d) => s + (checkState.denoms[d] || 0) * d, 0); }

function updateCheckDiff() {
  const bal = balance();
  const hasCash = checkState.actualCash !== null && !Number.isNaN(checkState.actualCash);
  const hasBank = checkState.actualBank !== null && !Number.isNaN(checkState.actualBank);

  const diffCash = hasCash ? (checkState.actualCash - bal.cash) : 0;
  const diffBank = hasBank ? (checkState.actualBank - bal.bank) : 0;

  const diffCashEl = $('#checkDiffCash');
  const noteCashWrap = $('#checkNoteCashWrap');
  if (diffCashEl && noteCashWrap) {
    if (!hasCash) {
      diffCashEl.textContent = 'Chưa nhập';
      diffCashEl.className = 'font-semibold tabular-nums text-[var(--text-3)]';
      noteCashWrap.classList.add('hidden');
    } else if (diffCash === 0) {
      diffCashEl.textContent = '0đ ✓ Khớp';
      diffCashEl.className = 'font-semibold tabular-nums text-[var(--income)]';
      noteCashWrap.classList.add('hidden');
    } else {
      diffCashEl.textContent = fmtDiff(diffCash) + (diffCash > 0 ? ' (thừa)' : ' (thiếu)');
      diffCashEl.className = 'font-semibold tabular-nums text-[var(--warn)]';
      noteCashWrap.classList.remove('hidden');
    }
  }

  const diffBankEl = $('#checkDiffBank');
  const noteBankWrap = $('#checkNoteBankWrap');
  if (diffBankEl && noteBankWrap) {
    if (!hasBank) {
      diffBankEl.textContent = 'Chưa nhập';
      diffBankEl.className = 'font-semibold tabular-nums text-[var(--text-3)]';
      noteBankWrap.classList.add('hidden');
    } else if (diffBank === 0) {
      diffBankEl.textContent = '0đ ✓ Khớp';
      diffBankEl.className = 'font-semibold tabular-nums text-[var(--income)]';
      noteBankWrap.classList.add('hidden');
    } else {
      diffBankEl.textContent = fmtDiff(diffBank) + (diffBank > 0 ? ' (thừa)' : ' (thiếu)');
      diffBankEl.className = 'font-semibold tabular-nums text-[var(--warn)]';
      noteBankWrap.classList.remove('hidden');
    }
  }

  const btn = $('#checkSaveBtn');
  if (!btn) return;
  const needNoteCash = hasCash && diffCash !== 0;
  const needNoteBank = hasBank && diffBank !== 0;
  const okCashNote = !needNoteCash || (checkState.noteCash || '').trim().length > 0;
  const okBankNote = !needNoteBank || (checkState.noteBank || '').trim().length > 0;
  const isAnyDiff = (hasCash && diffCash !== 0) || (hasBank && diffBank !== 0);
  const canSave = hasCash && hasBank && okCashNote && okBankNote;

  btn.disabled = !canSave;
  btn.classList.toggle('opacity-40', !canSave);
  btn.classList.toggle('pointer-events-none', !canSave);

  if (!hasCash || !hasBank) {
    btn.textContent = 'Nhập đủ Tiền mặt & Ngân hàng';
  } else if (!okCashNote || !okBankNote) {
    btn.textContent = 'Nhập lý do lệch để Cân bằng sổ';
  } else if (isAnyDiff) {
    btn.textContent = '⚖️ Cân bằng sổ';
  } else {
    btn.textContent = '✓ Xác nhận khớp sổ';
  }
}

function barChartHTML(series) {
  const maxV = Math.max(...series.map(s => Math.max(s.income, s.expense)), 1);
  const W = 280, H = 120, barW = 14, gap = 2;
  const step = (W - 20) / series.length;
  return `
    <svg viewBox="0 0 ${W} ${H + 20}" class="w-full">
      ${series.map((s, i) => {
        const x = 10 + i * step;
        const hIn = (s.income / maxV) * H;
        const hOut = (s.expense / maxV) * H;
        return `
          <rect x="${x}" y="${H - hIn}" width="${barW}" height="${hIn}" rx="2" fill="var(--income)"/>
          <rect x="${x + barW + gap}" y="${H - hOut}" width="${barW}" height="${hOut}" rx="2" fill="var(--expense)"/>
          <text x="${x + barW + gap/2}" y="${H + 14}" font-size="9" text-anchor="middle" fill="var(--text-3)">${s.label}</text>`;
      }).join('')}
    </svg>`;
}

const CHART_COLORS = ['#7A9E7E','#C0864F','#6D8FA3','#C98B7E','#8FBF9E','#B56A5E','#A8A296'];

function donutChartHTML(catMap, type) {
  const entries = Object.entries(catMap).filter(([, v]) => v > 0);
  if (entries.length === 0) return `<div class="flex h-[140px] items-center justify-center text-[13px] text-[var(--text-3)]">Chưa có dữ liệu</div>`;
  const total = entries.reduce((s, [, v]) => s + v, 0);
  const R = 40, C = 2 * Math.PI * R;
  let offset = 0;
  const segs = entries.map(([catId, v], i) => {
    const frac = v / total, dash = frac * C;
    const color = CHART_COLORS[i % CHART_COLORS.length];
    const seg = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${color}" stroke-width="14"
      stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 50 50)"/>`;
    offset += dash;
    return { seg, catId, v, color, frac };
  });
  return `
    <div class="flex items-center gap-4">
      <svg viewBox="0 0 100 100" class="h-[110px] w-[110px] shrink-0">${segs.map(s => s.seg).join('')}</svg>
      <ul class="min-w-0 flex-1 space-y-1 text-[12px]">
        ${segs.map(s => {
          const c = getCategory(type, s.catId);
          return `<li class="flex items-center gap-1.5">
            <span class="h-2 w-2 shrink-0 rounded-full" style="background:${s.color}"></span>
            <span class="flex-1 truncate">${c ? c.icon + ' ' + c.name : 'Khác'}</span>

          </li>`;
        }).join('')}
      </ul>
    </div>`;
}

function wireView() {
  const v = $('#view');

  const search = $('#ledgerSearch');
  if (search) {
    search.oninput = (e) => {
      ledgerFilter.q = e.target.value;
      renderLedgerContent();
    };
  }

  const fbSignInBtn = $('#fbAuthSignInBtn');
  if (fbSignInBtn) {
    fbSignInBtn.onclick = async () => {
      ensureFirestoreInstance();
      if (!firebaseAuth) { toast('Không tải được Firebase Auth', 'var(--warn)'); return; }
      const email = ($('#fbAdminEmail')?.value || '').trim();
      const pass = ($('#fbAdminPass')?.value || '').trim();
      if (!email || !pass) { toast('Nhập Email và Mật khẩu Thủ quỹ', 'var(--warn)'); return; }
      try {
        const cred = await firebaseAuth.signInWithEmailAndPassword(email, pass);
        firebaseAuthUser = cred.user;
        toast('Đã đăng nhập Thủ quỹ Firebase ✓', 'var(--income)');
        render();
      } catch (err) {
        toast('Lỗi đăng nhập Firebase: ' + (err.message || err.code), 'var(--warn)');
      }
    };
  }
  const fbSignOutBtn = $('#fbAuthSignOutBtn');
  if (fbSignOutBtn) {
    fbSignOutBtn.onclick = async () => {
      if (firebaseAuth) await firebaseAuth.signOut();
      firebaseAuthUser = null;
      toast('Đã thoát Firebase Auth');
      render();
    };
  }

  const notif = $('#setNotif');
  if (notif) notif.onchange = (e) => { if (!requirePinIfNeeded()) return; DB.settings.notifDaily = e.target.checked; saveDB(); };
  const time = $('#setTime');
  if (time) time.onchange = (e) => { if (!requirePinIfNeeded()) return; DB.settings.notifTime = e.target.value; saveDB(); };

  const bankSel = $('#setBankSelect');
  const bankCustom = $('#setBankCustom');
  const bankAcc = $('#setBankAcc');
  const bankHolder = $('#setBankHolder');
  const bankNote = $('#setBankNote');
  const adminPin = $('#setAdminPin');

  const syncBankSettings = () => {
    if (!requirePinIfNeeded()) return;
    const chosen = bankSel?.value === 'OTHER'
      ? (bankCustom?.value || 'BIDV').trim().toUpperCase()
      : (bankSel?.value || 'BIDV');
    const acc = (bankAcc?.value || '').trim();
    const holder = (bankHolder?.value || '').trim().toUpperCase();
    const noteTpl = (bankNote?.value ?? '').trim();
    DB.settings.bank = {
      bankCode: chosen || 'BIDV',
      accountNo: acc,
      accountName: holder,
      transferNote: noteTpl
    };
    saveDB();
    const prevWrap = $('#setBankQrPreviewWrap');
    const prevImg = $('#setBankQrPreview');
    const activeDrive = getActiveDrive();
    if (prevWrap && prevImg) {
      if (acc) {
        prevWrap.classList.remove('hidden');
        prevImg.src = buildVietQrUrl({
          bankCode: chosen || 'BIDV',
          accountNo: acc,
          accountName: holder,
          amount: activeDrive?.amount || 50000,
          customMemo: formatTransferMemo(noteTpl, 'Hoang Phong', 'TV01', activeDrive)
        });
      } else {
        prevWrap.classList.add('hidden');
      }
    }
  };

  if (bankSel) {
    bankSel.onchange = () => {
      if (bankCustom) bankCustom.classList.toggle('hidden', bankSel.value !== 'OTHER');
      syncBankSettings();
    };
  }
  if (bankCustom) bankCustom.onchange = syncBankSettings;
  if (bankAcc) bankAcc.onchange = syncBankSettings;
  if (bankHolder) bankHolder.onchange = syncBankSettings;
  if (bankNote) bankNote.onchange = syncBankSettings;
  if (adminPin) {
    adminPin.onchange = (e) => {
      if (!requirePinIfNeeded()) return;
      DB.settings.adminPin = (e.target.value || '1234').trim();
      saveDB();
      toast('Đã cập nhật mã PIN thủ quỹ');
    };
  }

  const restoreInput = $('#restoreJsonInput');
  if (restoreInput) {
    restoreInput.onchange = (e) => handleRestoreJSON(e, (restoredData) => {
      DB = normalizeDB(restoredData);
      balanceHidden = !!DB.settings.hideBalance;
      document.documentElement.dataset.theme = DB.settings.theme || 'giay-cu';
      saveDB();
      render();
      toast('Đã khôi phục nguyên trạng từ file JSON', 'var(--income)');
    });
  }

  if (currentView === 'check') wireCheckForm();

  $$('[data-theme-id]', v).forEach(btn => {
    btn.onclick = () => { applyTheme(btn.dataset.themeId); render(); };
  });
  $$('[data-report-month]', v).forEach(btn => {
    btn.onclick = () => { reportMonth = btn.dataset.reportMonth; render(); };
  });
  $$('[data-chip]', v).forEach(btn => {
    btn.onclick = () => {
      const [group, val] = btn.dataset.chip.split(':');
      ledgerFilter[group] = val;
      render();
    };
  });
}

function wireCheckForm() {
  const bal = balance();

  $$('.check-mode-btn').forEach(btn => {
    btn.onclick = () => {
      checkState.mode = btn.dataset.checkMode;
      $$('.check-mode-btn').forEach(b => {
        const active = b.dataset.checkMode === checkState.mode;
        b.style.background = active ? 'var(--accent)' : 'transparent';
        b.style.color = active ? 'var(--on-accent)' : 'var(--text-2)';
      });
      const direct = $('#checkDirectWrap');
      const denoms = $('#checkDenomsWrap');
      if (checkState.mode === 'direct') {
        direct.classList.remove('hidden');
        denoms.classList.add('hidden');
        const inp = $('#checkActualCash');
        if (inp) { inp.value = checkState.actualCash !== null ? checkState.actualCash : ''; inp.focus(); }
      } else {
        direct.classList.add('hidden');
        denoms.classList.remove('hidden');
        renderCheckDenoms();
      }
    };
    const active = btn.dataset.checkMode === checkState.mode;
    btn.style.background = active ? 'var(--accent)' : 'transparent';
    btn.style.color = active ? 'var(--on-accent)' : 'var(--text-2)';
  });

  if (checkState.mode === 'denoms') {
    $('#checkDirectWrap')?.classList.add('hidden');
    $('#checkDenomsWrap')?.classList.remove('hidden');
    renderCheckDenoms();
  }

  const cashInp = $('#checkActualCash');
  const cashFmtDisp = $('#checkCashFormatted');
  if (cashFmtDisp && checkState.actualCash !== null) {
    cashFmtDisp.textContent = '= ' + fmtMoney(checkState.actualCash);
  }
  if (cashInp) {
    cashInp.oninput = (e) => {
      const raw = e.target.value.trim();
      if (raw === '') {
        checkState.actualCash = null;
        if (cashFmtDisp) cashFmtDisp.textContent = '';
      } else {
        const num = Math.max(0, parseInt(raw, 10) || 0);
        checkState.actualCash = num;
        if (cashFmtDisp) cashFmtDisp.textContent = '= ' + fmtMoney(num);
      }
      updateCheckDiff();
    };
  }

  const bankInp = $('#checkActualBank');
  const bankFmtDisp = $('#checkBankFormatted');
  if (bankFmtDisp && checkState.actualBank !== null) {
    bankFmtDisp.textContent = '= ' + fmtMoney(checkState.actualBank);
  }
  if (bankInp) {
    bankInp.oninput = (e) => {
      const raw = e.target.value.trim();
      if (raw === '') {
        checkState.actualBank = null;
        if (bankFmtDisp) bankFmtDisp.textContent = '';
      } else {
        const num = Math.max(0, parseInt(raw, 10) || 0);
        checkState.actualBank = num;
        if (bankFmtDisp) bankFmtDisp.textContent = '= ' + fmtMoney(num);
      }
      updateCheckDiff();
    };
  }

  const matchCashBtn = $('#matchCashBtn');
  if (matchCashBtn) {
    matchCashBtn.onclick = () => {
      checkState.actualCash = Math.max(0, Math.round(bal.cash));
      if (cashInp) cashInp.value = checkState.actualCash;
      if (cashFmtDisp) cashFmtDisp.textContent = '= ' + fmtMoney(checkState.actualCash);
      updateCheckDiff();
    };
  }

  const matchBankBtn = $('#matchBankBtn');
  if (matchBankBtn) {
    matchBankBtn.onclick = () => {
      checkState.actualBank = Math.max(0, Math.round(bal.bank));
      if (bankInp) bankInp.value = checkState.actualBank;
      if (bankFmtDisp) bankFmtDisp.textContent = '= ' + fmtMoney(checkState.actualBank);
      updateCheckDiff();
    };
  }

  const noteCashInp = $('#checkNoteCash');
  if (noteCashInp) noteCashInp.oninput = (e) => { checkState.noteCash = e.target.value; updateCheckDiff(); };
  $$('[data-quick-note-cash]').forEach(btn => {
    btn.onclick = () => {
      checkState.noteCash = btn.dataset.quickNoteCash;
      if (noteCashInp) { noteCashInp.value = checkState.noteCash; noteCashInp.focus(); }
      updateCheckDiff();
    };
  });

  const noteBankInp = $('#checkNoteBank');
  if (noteBankInp) noteBankInp.oninput = (e) => { checkState.noteBank = e.target.value; updateCheckDiff(); };
  $$('[data-quick-note-bank]').forEach(btn => {
    btn.onclick = () => {
      checkState.noteBank = btn.dataset.quickNoteBank;
      if (noteBankInp) { noteBankInp.value = checkState.noteBank; noteBankInp.focus(); }
      updateCheckDiff();
    };
  });

  const saveBtn = $('#checkSaveBtn');
  if (saveBtn) saveBtn.onclick = saveCheck;
  updateCheckDiff();
}

function saveCheck() {
  if (!requirePinIfNeeded()) return;
  if (checkState.actualCash === null || checkState.actualBank === null) return;

  const bal = balance();
  const bookCash = bal.cash;
  const bookBank = bal.bank;
  const actualCash = checkState.actualCash;
  const actualBank = checkState.actualBank;
  const diffCash = actualCash - bookCash;
  const diffBank = actualBank - bookBank;

  const adjCashTx = createReconcileTransaction('cash', bookCash, actualCash, checkState.noteCash);
  const adjBankTx = createReconcileTransaction('bank', bookBank, actualBank, checkState.noteBank);

  if (adjCashTx) DB.transactions.push(adjCashTx);
  if (adjBankTx) DB.transactions.push(adjBankTx);

  const existing = getTodayCheck();
  const payload = {
    id: existing?.id || uid(),
    date: todayISO(),
    book: bookCash,
    actual: actualCash,
    diff: diffCash + diffBank,
    bookCash,
    actualCash,
    diffCash,
    noteCash: diffCash !== 0 ? checkState.noteCash.trim() : '',
    bookBank,
    actualBank,
    diffBank,
    noteBank: diffBank !== 0 ? checkState.noteBank.trim() : '',
    note: [
      diffCash !== 0 ? `TM: ${checkState.noteCash.trim()}` : '',
      diffBank !== 0 ? `CK: ${checkState.noteBank.trim()}` : ''
    ].filter(Boolean).join(' | '),
    mode: checkState.mode,
    denominations: checkState.mode === 'denoms' ? { ...checkState.denoms } : null,
    createdAt: Date.now(),
  };

  if (existing) {
    const i = DB.cashChecks.findIndex(c => c.id === existing.id);
    DB.cashChecks[i] = payload;
  } else {
    DB.cashChecks.push(payload);
  }

  saveDB();
  checkState.editing = false;
  checkState.actualCash = null;
  checkState.actualBank = null;
  checkState.denoms = {};
  checkState.noteCash = '';
  checkState.noteBank = '';
  checkState.mode = 'direct';

  const hasAdj = !!(adjCashTx || adjBankTx);
  toast(
    hasAdj

document.addEventListener('click', (e) => {
  const menu = $('#themeMenu');
  if (menu && !menu.classList.contains('hidden') && !menu.contains(e.target) && !e.target.closest('#themeBtn')) {
    menu.classList.add('hidden');
  }

  const copyViewBtn = e.target.closest('[data-copy-view-link]');
  if (copyViewBtn) {
    copyText(copyViewBtn.dataset.copyViewLink);
    return;
  }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  const id = act.dataset.id;
  switch (a) {
    case 'unlock-pin':
      if (requirePinIfNeeded()) { render(); }
      return;
    case 'toggle-balance':
      balanceHidden = !balanceHidden;
      if (!isGuestLocked()) DB.settings.hideBalance = balanceHidden;
      render();
      return;
    case 'open-capture': if (requirePinIfNeeded()) openCaptureSheet(); return;
    case 'go-check': navigate('check'); return;
    case 'go-reports': navigate('reports'); return;
    case 'go-ledger': navigate('ledger'); return;
    case 'open-members': openMembersSheet(); return;
    case 'open-inbox': if (requirePinIfNeeded()) openInboxSheet(); return;
    case 'edit-tx': if (requirePinIfNeeded()) openCaptureSheet(id); return;
    case 'view-receipt': {
      const tx = DB.transactions.find(x => x.id === id);
      if (tx && tx.receipt) openReceiptModal(tx.receipt, tx.note || tx.categoryName || 'Hóa đơn');
      return;
    }
    case 'edit-check': if (requirePinIfNeeded()) { checkState.editing = true; render(); } return;
    case 'export-xlsx': exportExcel(); return;
    case 'export-csv': exportCSV(); return;
    case 'export-json': exportJSONBackup(DB); return;
    case 'import-json': $('#restoreJsonInput')?.click(); return;
    case 'logout':
      doLogout();
      return;
    case 'clear-data':
      if (!requirePinIfNeeded()) return;
      if (confirm('Xoá toàn bộ giao dịch, kiểm đếm, đợt thu, thành viên của tài khoản này?\nSố dư sẽ về 0. Không hoàn tác được.')) {
        DB = emptyDB(); saveDB();
        balanceHidden = false;
        document.documentElement.dataset.theme = DB.settings.theme;
        navigate('home');
        toast('Đã xoá — bắt đầu lại từ đầu 🌿');
      }
      return;
    case 'delete-account':
      if (!requirePinIfNeeded()) return;
      if (confirm('Xoá tài khoản và toàn bộ dữ liệu?\nKhông thể phục hồi.')) {
        if (confirm('Chắc chắn chứ? Đây là lần xác nhận cuối.')) {
          const users = loadUsers().filter(u => u.username !== currentUser.username);
          saveUsers(users);
          safeStorage.removeItem(userDBKey(currentUser.username));
          clearSession();
          currentUser = null; DB = null;
          showAuthScreen();
          toast('Đã xoá tài khoản', 'var(--warn)');
        }
      }
      return;
    case 'demo-notify':
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('🌿 Sổ Quỹ Lớp', { body: 'Đến giờ kiểm đếm quỹ rồi — 1 phút thôi!' });
        toast('Đã gửi thông báo thử');
      } else if ('Notification' in window) {
        Notification.requestPermission().then(p => toast(p === 'granted' ? 'Đã bật quyền thông báo' : 'Bạn đã từ chối quyền thông báo'));
      } else toast('Trình duyệt không hỗ trợ Notification');
      return;
  }
});

function openCaptureSheet(editId = null) {
  const activeDrive = getActiveDrive();
  sheetState.type = 'in'; sheetState.amount = 0; sheetState.category = null;
  sheetState.account = 'cash'; sheetState.date = todayISO();
  sheetState.member = ''; sheetState.driveId = activeDrive?.id || '';
  sheetState.note = ''; sheetState.receipt = null; sheetState.receiptKB = 0;
  sheetState.fromNoti = false; sheetState.editId = editId;

  if (editId) {
    const t = DB.transactions.find(x => x.id === editId);
    if (t) {
      sheetState.type = t.type; sheetState.amount = t.amount;
      sheetState.category = t.category; sheetState.account = t.wallet || t.account || 'cash';
      sheetState.date = t.date; sheetState.member = t.member || '';
      sheetState.driveId = t.driveId || activeDrive?.id || '';
      sheetState.note = t.note || ''; sheetState.receipt = t.receipt || null;
      sheetState.receiptKB = t.receipt ? Math.max(1, Math.round(estimateDataUrlBytes(t.receipt) / 1024)) : 0;
      sheetState.fromNoti = t.status === 'draft' && !t.category;
    }
  }
  renderCaptureSheet();
  showSheet();
  setTimeout(() => $('#capAmount')?.focus({ preventScroll: true }), 320);
}

function wireCaptureSheet() {
  renderCapType(); renderCapCats(); renderCapAcc(); updateCapSave();

  $$('.cap-type').forEach(btn => {
    btn.onclick = () => {
      sheetState.type = btn.dataset.capType;
      sheetState.category = null;
      renderCapType(); renderCapCats();
      $('#capMemberWrap').style.display = sheetState.type === 'in' ? '' : 'none';
      $('#capDriveWrap').style.display = (sheetState.type === 'in' && sheetState.member) ? '' : 'none';
      updateCapSave();
    };
  });

  const amountInp = $('#capAmount');
  const fmtDisp = $('#capFormatted');

  if (sheetState.amount) fmtDisp.textContent = '= ' + fmt(sheetState.amount) + 'đ';

  amountInp.oninput = (e) => {
    const num = Math.max(0, parseInt(e.target.value, 10) || 0);
    sheetState.amount = num;
    fmtDisp.textContent = num ? ('= ' + fmt(num) + 'đ') : '';
    updateCapSave();
  };

  $$('.cap-add').forEach(btn => {
    btn.onclick = () => {
      sheetState.amount += parseInt(btn.dataset.capAdd, 10);
      amountInp.value = sheetState.amount;
      fmtDisp.textContent = '= ' + fmt(sheetState.amount) + 'đ';
      updateCapSave();
    };
  });

  $$('.cap-acc').forEach(btn => {
    btn.onclick = () => { sheetState.account = btn.dataset.capAcc; renderCapAcc(); };
  });

  $('#capDate').onchange = (e) => { sheetState.date = e.target.value; };
  $('#capMember').onchange = (e) => {
    sheetState.member = e.target.value;
    const driveWrap = $('#capDriveWrap');
    if (driveWrap) {
      driveWrap.style.display = (sheetState.type === 'in' && sheetState.member) ? '' : 'none';
    }
    if (sheetState.type === 'in' && sheetState.member && !sheetState.category) {
      sheetState.category = 'quy';
      renderCapCats();
      updateCapSave();
    }
    if (sheetState.type === 'in' && sheetState.member && !sheetState.amount) {
      const mem = DB.members.find(m => m.name === sheetState.member);
      const drv = getDriveById(sheetState.driveId);
      if (mem && drv) {
        const st = getMemberDriveStatus(mem.id, drv.id);
        const suggested = st.remaining > 0 ? st.remaining : drv.amount;
        if (suggested > 0) {
          sheetState.amount = suggested;
          amountInp.value = suggested;
          fmtDisp.textContent = '= ' + fmt(suggested) + 'đ';
          updateCapSave();
        }
      }
    }
  };

  const capDriveSel = $('#capDrive');
  if (capDriveSel) {
    capDriveSel.onchange = (e) => { sheetState.driveId = e.target.value; };
  }

  $('#capNote').oninput = (e) => { sheetState.note = e.target.value; };

  $('#capReceipt').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    compressReceiptUnder100KB(f, (compressedBase64, sizeKB) => {
      sheetState.receipt = compressedBase64;
      sheetState.receiptKB = sizeKB;
      $('#capReceiptPrev').classList.remove('hidden');
      $('#capReceiptPrev').innerHTML = `
        <div class="flex items-center gap-3 rounded-xl border border-[var(--border)] bg-[var(--surface-2)] p-2">
          <img id="capReceiptThumb" src="${sheetState.receipt}" class="h-14 w-14 rounded-lg object-cover cursor-pointer" alt="hoá đơn" />
          <div class="min-w-0 flex-1 text-left">
            <p class="text-[12px] font-semibold text-[var(--income)]">✓ Đã nén ảnh hóa đơn (${sizeKB} KB)</p>
            <p class="text-[11px] text-[var(--text-3)]">Bấm vào ảnh để xem phóng to</p>
          </div>
          <button type="button" data-cap-rm-receipt class="flex h-7 w-7 items-center justify-center rounded-full bg-[var(--text)] text-[11px] text-[var(--bg)]">✕</button>
        </div>`;
      wireCapReceiptRemove();
    });
  };
  wireCapReceiptRemove();

  $('#capSave').onclick = saveCapture;

  $$('[data-cap-delete]').forEach(btn => {
    btn.onclick = () => {
      if (!sheetState.editId) return;
      if (!confirm('Xoá giao dịch này? Không hoàn tác được.')) return;
      DB.transactions = DB.transactions.filter(t => t.id !== sheetState.editId);
      saveDB(); closeSheet();
      toast('Đã xoá giao dịch', 'var(--warn)');
      render();
    };
  });

  $('#capCats').onclick = (e) => {
    const btn = e.target.closest('[data-cap-cat]'); if (!btn) return;
    const id = btn.dataset.capCat;
    sheetState.category = (sheetState.category === id) ? null : id;
    renderCapCats(); updateCapSave();
  };
}

function wireCapReceiptRemove() {
  $$('[data-cap-rm-receipt]').forEach(btn => {
    btn.onclick = () => {
      sheetState.receipt = null;
      sheetState.receiptKB = 0;
      $('#capReceipt').value = '';
      $('#capReceiptPrev').classList.add('hidden');
    };
  });
  const thumb = $('#capReceiptThumb');
  if (thumb) {
    thumb.onclick = () => {
      if (sheetState.receipt) openReceiptModal(sheetState.receipt, sheetState.note || 'Ảnh hóa đơn');
    };
  }
}

function renderCapType() {
  $$('.cap-type').forEach(btn => {
    const active = btn.dataset.capType === sheetState.type;
    const color = sheetState.type === 'in' ? 'var(--income)' : 'var(--expense)';
    btn.style.background = active ? color : 'transparent';
    btn.style.color = active ? '#fff' : 'var(--text-2)';
  });
}
function renderCapCats() {
  const list = CATEGORIES[sheetState.type] || [];
  $('#capCats').innerHTML = list.map(c => {
    const active = sheetState.category === c.id;
    return `<button data-cap-cat="${c.id}" class="press rounded-lg px-3 py-2 text-[13px] font-medium
      ${active ? 'bg-[var(--accent)] text-[var(--on-accent)]' : 'bg-[var(--surface-2)] text-[var(--text)]'}">
      ${c.icon} ${c.name}</button>`;
  }).join('');
}
function renderCapAcc() {
  $$('.cap-acc').forEach(btn => {
    const active = btn.dataset.capAcc === sheetState.account;
    btn.style.background = active ? 'var(--accent-soft)' : 'transparent';
    btn.style.borderColor = active ? 'var(--accent)' : 'var(--border)';
    btn.style.color = active ? 'var(--accent)' : 'var(--text-2)';
    btn.style.fontWeight = active ? '600' : '500';
  });
}
function updateCapSave() {
  const saveBtn = $('#capSave'); const hint = $('#capDraftHint');
  if (!saveBtn) return;
  const hasAmount = sheetState.amount > 0;
  const isDraft = hasAmount && !sheetState.category;
  saveBtn.disabled = !hasAmount;
  saveBtn.classList.toggle('opacity-40', !hasAmount);
  saveBtn.classList.toggle('pointer-events-none', !hasAmount);
  saveBtn.textContent = !hasAmount ? 'Nhập số tiền' : (isDraft ? 'Lưu nháp' : 'Lưu');
  hint.classList.toggle('hidden', !isDraft || !!sheetState.editId);
}

function saveCapture() {
  if (sheetState.amount <= 0) return;
  const isDraft = !sheetState.category;
  const cat = sheetState.category ? getCategory(sheetState.type, sheetState.category) : null;
  const linkedDriveId = (sheetState.type === 'in' && sheetState.member)
    ? (sheetState.driveId || getActiveDrive()?.id || null)
    : null;
  const linkedDrive = linkedDriveId ? getDriveById(linkedDriveId) : null;
  const autoNote = sheetState.note.trim() || (
    (sheetState.type === 'in' && sheetState.member && linkedDrive)
      ? `Thu ${linkedDrive.name} · ${sheetState.member}`
      : ''
  );

  const tx = {
    id: sheetState.editId || uid(),
    type: sheetState.type,
    amount: sheetState.amount,
    category: sheetState.category,
    categoryName: cat ? cat.name : 'Chưa phân loại',
    driveId: linkedDriveId,
    wallet: sheetState.account,
    account: sheetState.account,
    date: sheetState.date,
    member: sheetState.type === 'in' ? sheetState.member : '',
    note: autoNote,
    receipt: sheetState.receipt,
    status: isDraft ? 'draft' : 'done',
    createdAt: Date.now(),
  };

  if (sheetState.editId) {
    const i = DB.transactions.findIndex(t => t.id === sheetState.editId);
    if (i >= 0) DB.transactions[i] = { ...DB.transactions[i], ...tx, createdAt: DB.transactions[i].createdAt };
  } else {
    DB.transactions.push(tx);
  }

  saveDB();
  closeSheet();

  const syncedMsg = (!isDraft && tx.member && linkedDrive)
    ? ` & đã cập nhật ${tx.member} vào ${linkedDrive.name}`
    : '';
  toast(isDraft
    ? `Đã lưu nháp ${fmtMoney(sheetState.amount)} vào Hộp thư nháp`
    : `Đã ghi ${sheetState.type === 'in' ? '+' : '−'}${fmt(sheetState.amount)}đ${syncedMsg}`,
    isDraft ? null : (sheetState.type === 'in' ? 'var(--income)' : 'var(--expense)'));
  render();
}

let memberFilterTab = 'all';

function openMembersSheet() {
  renderMembersSheet();
  showSheet();

function renderMemberRowsHtml(list, query = '', driveId = null) {
  const drive = getDriveById(driveId);
  const qNorm = stripVietnamese(query || '').toLowerCase();
  const filtered = qNorm
    ? list.filter(m => stripVietnamese(m.name).toLowerCase().includes(qNorm) || stripVietnamese(m.code || '').toLowerCase().includes(qNorm))
    : list.slice();

  // Đưa người đã báo chuyển khoản (chờ duyệt) lên đầu danh sách; sau khi duyệt xong tự quay về thứ tự ban đầu
  const rows = filtered.sort((a, b) => {
    const aPending = !!getMemberDriveStatus(a.id, drive?.id).pendingTs;
    const bPending = !!getMemberDriveStatus(b.id, drive?.id).pendingTs;
    if (aPending !== bPending) return aPending ? -1 : 1;
    return 0;
  });

  if (!rows.length) {
    return `<div class="py-8 text-center text-[13px] text-[var(--text-3)]">Không tìm thấy thành viên phù hợp</div>`;
  }
  return `<ul class="divide-y divide-[var(--border)]">
    ${rows.map(m => {
      const st = getMemberDriveStatus(m.id, drive?.id);
      const paid = st.isFullyPaid;
      const partial = st.isPartial;
      const pending = !!st.pendingTs;
      const paidTimeStr = (paid || partial) ? getMemberPaidLabel(m.id, drive?.id) : '';
      const guestMode = isGuestLocked();

      return `<li class="py-2.5 ${pending ? 'bg-[var(--draft-bg)] -mx-2 px-2 rounded-xl' : ''}">
        <div class="flex min-w-0 items-center gap-2">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[var(--surface-2)] text-[11px] font-semibold">${escapeHtml(m.code || m.name[0])}</span>
          <button type="button" data-qr-member="${m.id}" class="min-w-0 flex-1 truncate text-left text-[13.5px] font-medium leading-snug hover:underline">
            ${escapeHtml(m.name)}
          </button>
          ${guestMode
            ? `<span class="shrink-0 text-[11px] font-mono text-[var(--text-3)]">${paid ? '✓ Đã đóng' : (pending ? '⏳ Đã báo CK' : (partial ? `Thiếu ${fmt(st.remaining)}đ` : escapeHtml(m.code || '')))}</span>`
            : (paid
              ? `<span class="shrink-0 text-[11px] font-mono text-[var(--income)]">🕒 ${escapeHtml(paidTimeStr)}</span>`
              : (partial
                ? `<span class="shrink-0 text-[11px] font-semibold text-[var(--expense)]">Đã đóng ${fmt(st.paidAmount)}đ · Thiếu ${fmt(st.remaining)}đ</span>`
                : (pending
                  ? `<span class="shrink-0 text-[11px] font-medium text-[var(--expense)]">⏳ Đã báo CK</span>`
                  : `<span class="shrink-0 text-[11px] font-mono text-[var(--text-3)]">Thiếu ${fmt(st.remaining)}đ</span>`)))}
        </div>
        <div class="mt-1.5 flex items-center justify-end gap-1.5">
          ${!paid ? `<button data-qr-member="${m.id}" class="press rounded-lg border border-[var(--accent)] bg-[var(--accent-soft)] px-2.5 py-1 text-[11.5px] font-semibold text-[var(--accent)] whitespace-nowrap">
            QR ${st.remaining > 0 ? `(${fmt(st.remaining)}đ)` : ''}
          </button>` : ''}
          ${guestMode
            ? (!paid ? `<button data-qr-member="${m.id}" class="press rounded-lg px-2.5 py-1 text-[11.5px] font-semibold whitespace-nowrap ${pending ? 'border border-[var(--income)] bg-[var(--accent-soft)] text-[var(--income)]' : 'bg-[var(--accent)] text-[var(--on-accent)]'}">
                ${pending ? '✓ Tôi đã CK (Chờ duyệt)' : 'Quét QR & Báo CK'}
              </button>` : '')
            : `
              <button data-toggle-member="${m.id}" class="press rounded-lg px-2.5 py-1 text-[12px] font-medium whitespace-nowrap
                ${paid
                  ? 'bg-[var(--accent-soft)] text-[var(--accent)]'
                  : (pending ? 'bg-[var(--expense)] text-white' : 'bg-[var(--surface-2)] text-[var(--text-2)]')}">
                ${paid ? '✓ Đã đóng' : (pending ? 'Duyệt CK ✓' : (partial ? 'Thu nốt ✓' : 'Chưa đóng'))}
              </button>
              <button data-remove-member="${m.id}" aria-label="Xoá thành viên"
                class="press flex h-7 w-7 items-center justify-center rounded-lg text-[var(--text-3)] hover:bg-[var(--surface-2)] hover:text-[var(--warn)]">×</button>`}
        </div>
      </li>`;
    }).join('')}
  </ul>`;
}

function wireMemberRowEvents(container, driveId) {
  const drive = getDriveById(driveId);
  $$('[data-qr-member]', container).forEach(btn => {
    btn.onclick = () => {
      const m = DB.members.find(x => x.id === btn.dataset.qrMember);
      if (!m) return;
      const st = getMemberDriveStatus(m.id, drive?.id);
      const amtToPay = st.remaining > 0 ? st.remaining : (drive?.amount || 0);
      openMemberQr(m.name, amtToPay, m.id, m.code || '', drive?.id);
    };
  });
  $$('[data-toggle-member]', container).forEach(btn => {
    btn.onclick = () => {
      if (!requirePinIfNeeded()) return;
      const id = btn.dataset.toggleMember;
      const st = getMemberDriveStatus(id, drive?.id);
      setMemberPaidStatus(id, !st.isFullyPaid, { driveId: drive?.id });
      saveDB();
      renderMembersSheet();
      if (currentView === 'home' || currentView === 'reports') render();
    };
  });
  $$('[data-remove-member]', container).forEach(btn => {
    btn.onclick = () => {
      if (!requirePinIfNeeded()) return;
      const id = btn.dataset.removeMember;
      const m = DB.members.find(x => x.id === id);
      if (!m) return;
      if (!confirm(`Xoá "${m.name}" khỏi danh sách lớp?`)) return;
      DB.members = sortAndReindexMembers(DB.members.filter(x => x.id !== id));
      DB.drives.forEach(d => {
        if (d.paid) delete d.paid[id];
        if (d.pending) delete d.pending[id];
      });
      syncLegacyMirrorsFromActiveDrive();
      saveDB();
      renderMembersSheet();
      if (currentView === 'home' || currentView === 'reports') render();
    };
  });
}

function buildSmartRemindMessage(drive) {
  const dObj = drive || getActiveDrive();
  if (!dObj) return '';
  const bank = DB.settings?.bank || {};
  const unpaidLines = [];
  let totalMissing = 0;

  DB.members.forEach((m) => {
    const st = getMemberDriveStatus(m.id, dObj.id);
    if (!st.isFullyPaid) {
      const miss = st.remaining > 0 ? st.remaining : dObj.amount;
      totalMissing += miss;
      unpaidLines.push(`${unpaidLines.length + 1}. ${m.name} — thiếu ${fmtMoney(miss)}`);
    }
  });

  if (!unpaidLines.length) return '';

  const viewUrl = `${location.origin}${location.pathname}?room=${encodeURIComponent(getRoomId())}&view=1`;
  const stkLine = bank.accountNo
    ? `🏦 STK: ${bank.accountNo} (${(bank.bankCode || 'BIDV').toUpperCase()})${bank.accountName ? ` - ${bank.accountName}` : ''}`
    : `💵 Nộp trực tiếp cho Thủ quỹ hoặc chuyển khoản quỹ lớp`;
  const memoExample = formatTransferMemo(
    bank.transferNote !== undefined ? bank.transferNote : '{ten} dong quy {dot}',
    'Ten Ban',
    'TV01',
    dObj
  );

  return [
    `📢 NHẮC ĐÓNG QUỸ: ${dObj.name.toUpperCase()} (${fmtMoney(dObj.amount)}/bạn)`,
    `Hiện còn ${unpaidLines.length} bạn chưa hoàn thành (tổng thiếu ${fmtMoney(totalMissing)}):`,
    ...unpaidLines,
    ``,
    stkLine,
    `📝 Nội dung CK: ${memoExample}`,
    `🔗 Link xem & quét mã VietQR tự điền số tiền: ${viewUrl}`,
    `Cảm ơn cả lớp 🌿`
  ].join('\n');
}

  const activeDrive = getActiveDrive();

          ` : ''}
        </div>

        ${!isGuestLocked() && activeDrive ? `
        <div class="flex items-center justify-between gap-2 text-[12px]">
          <span class="text-[var(--text-2)]">Mức thu đợt này:</span>
          <div class="flex items-center gap-1">

          <button data-member-tab="${tab.id}" class="press shrink-0 rounded-lg px-2.5 py-1.5 text-[11.5px] font-medium

      </div>

        📋 Dán danh sách (mỗi dòng một tên)

      ${memberFilterTab !== 'logs' && DB.members.length > 0 ? `
      <div class="mt-2">
        <input id="memberSearchInp" type="text" placeholder="🔍 Tìm nhanh tên hoặc mã (VD: Phong, TV01)..."

      </div>` : ''}
    </div>

    <!-- LỚP DƯỚI CUỘN ĐỘC LẬP: DANH SÁCH THÀNH VIÊN / LỊCH SỬ -->
    <div id="memberListScroll" class="scroll-y flex-1 overflow-y-auto px-5 pb-4 pt-2">
      ${memberFilterTab === 'logs'
        ? (logs.length === 0
            ? `<div class="py-10 text-center text-[13px] text-[var(--text-3)]">Chưa có lịch sử nộp quỹ trong đợt này</div>`

                  </li>`).join('')}

        : (DB.members.length === 0

                <p class="text-3xl mb-2">👥</p>
                <p class="text-[14px] font-medium">Chưa có thành viên nào</p>

    <footer class="shrink-0 border-t border-[var(--border)] bg-[var(--surface)] px-5 py-3 z-10" style="padding-bottom:max(0.75rem,env(safe-area-inset-bottom))">

      const dFeeRaw = prompt(`Mức thu mỗi bạn cho "${dName.trim()}" (đồng):`, '50000');
      if (dFeeRaw === null) return;
      const dFee = Math.max(0, Math.round(Number(dFeeRaw) || 0));
      const newDrive = {
        id: 'drive_' + uid(),
        name: dName.trim(),
        shortCode: buildDriveShortCode(dName.trim()),
        amount: dFee,
        createdAt: Date.now(),
        paid: {},
        pending: {}
      };
      DB.drives.push(newDrive);
      DB.activeDriveId = newDrive.id;
      syncLegacyMirrorsFromActiveDrive();
      saveDB();
      renderMembersSheet();
      if (currentView === 'home' || currentView === 'reports') render();
      toast(`Đã tạo đợt thu "${newDrive.name}" (${fmtMoney(dFee)})`, 'var(--income)');
    };
  }

  const delDriveBtn = $('#delDriveBtn', el);
  if (delDriveBtn && activeDrive && DB.drives.length > 1) {

      if (!requirePinIfNeeded()) return;

      DB.activeDriveId = DB.drives[0].id;
      syncLegacyMirrorsFromActiveDrive();
      saveDB();
      renderMembersSheet();
      if (currentView === 'home' || currentView === 'reports') render();
      toast(`Đã xoá đợt "${activeDrive.name}"`);
    };
  }

  const quickFeeInp = $('#quickDriveFeeInp', el);

    quickFeeInp.onchange = () => {
      if (!requirePinIfNeeded()) return;
      const val = Math.max(0, parseInt(quickFeeInp.value, 10) || 0);
      activeDrive.amount = val;
      syncLegacyMirrorsFromActiveDrive();
      saveDB();
      renderMembersSheet();
      toast(`Đã cập nhật mức thu "${activeDrive.name}": ${fmtMoney(val)}`, 'var(--income)');

  $$('[data-member-tab]', el).forEach(btn => { btn.onclick = () => { memberFilterTab = btn.dataset.memberTab; renderMembersSheet(); }; });

  const rowsContainer = $('#memberRowsContainer', el);
  const searchInp = $('#memberSearchInp', el);
  if (rowsContainer) {
    wireMemberRowEvents(rowsContainer, activeDrive?.id);
    if (searchInp) {
      searchInp.oninput = () => {
        rowsContainer.innerHTML = renderMemberRowsHtml(filteredMembers, searchInp.value, activeDrive?.id);
        wireMemberRowEvents(rowsContainer, activeDrive?.id);
      };
    }
  }

  const addBtn = $('#addMemberBtn', el);
  const newNameInp = $('#newMemberName', el);
  const importBtn = $('[data-import-members]', el);
  const copyDebtBtn = $('[data-copy-debt]', el);
  if (addBtn) addBtn.onclick = addMemberFromInput;
  if (newNameInp) newNameInp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addMemberFromInput(); } };
  if (importBtn) importBtn.onclick = importMembers;
  if (copyDebtBtn) {
    copyDebtBtn.onclick = () => {
      if (DB.members.length === 0) { toast('Chưa có thành viên nào để nhắc'); return; }
      const msg = buildSmartRemindMessage(activeDrive);
      if (!msg) { toast(`Cả lớp đã đóng đủ "${activeDrive?.name}" 🎉`, 'var(--income)'); return; }
      copyText(msg);
    };
  }
}

function addMemberFromInput() {
  if (!requirePinIfNeeded()) return;
  const inp = $('#newMemberName'); if (!inp) return;
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  if (DB.members.some(m => m.name.toLowerCase() === name.toLowerCase())) {
    toast('Tên này đã có trong danh sách'); return;
  }
  DB.members.push({ id: uid(), code: '', name });
  DB.members = sortAndReindexMembers(DB.members);
  saveDB(); inp.value = '';
  renderMembersSheet();
  if (currentView === 'home') render();
  setTimeout(() => $('#newMemberName')?.focus(), 50);
  toast(`Đã thêm "${name}" & cập nhật số báo danh`, 'var(--income)');
}

function importMembers() {
  if (!requirePinIfNeeded()) return;
  const txt = prompt('Dán danh sách tên (mỗi dòng một tên, hoặc cách nhau bởi dấu phẩy):');
  if (!txt) return;
  const names = txt.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  if (!names.length) return;
  let added = 0, skipped = 0;
  for (const name of names) {
    if (DB.members.some(m => m.name.toLowerCase() === name.toLowerCase())) { skipped++; continue; }
    DB.members.push({ id: uid(), code: '', name });
    added++;
  }
  DB.members = sortAndReindexMembers(DB.members);
  saveDB(); renderMembersSheet();
  if (currentView === 'home') render();
  toast(`Đã thêm ${added} thành viên${skipped ? `, bỏ qua ${skipped} trùng` : ''} & xếp lại SBD`, 'var(--income)');
}
